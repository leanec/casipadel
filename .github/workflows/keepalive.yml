# El free tier de Supabase pausa proyectos tras ~7 días sin tráfico: un ping
# semanal a league_meta (SELECT público) cuenta como actividad.
# Requiere los secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY en el repo.
name: Keepalive Supabase

on:
  schedule:
    - cron: '30 14 * * 1' # lunes 11:30 de Buenos Aires
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping a league_meta
        run: |
          curl -sf \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/league_meta?select=revision"
